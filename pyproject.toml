[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "asset-gate"
version = "1.0.0"
description = "Validate-then-publish gate for Maya assets, ending in a USD component asset."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Arsam Ali" }]
requires-python = ">=3.10"
dependencies = ["usd-core", "PyYAML"]

[project.optional-dependencies]
ui = ["PySide6"]
test = ["pytest"]

[project.scripts]
asset-gate = "asset_gate.cli:main"

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
testpaths = ["python/asset_gate/test"]
pythonpath = ["python"]
